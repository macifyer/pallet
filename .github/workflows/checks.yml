name: Checks
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  python-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release metadata and Python syntax
        run: python3 scripts/check_release.py
      - name: Check tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests -v
